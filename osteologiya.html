function load(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem(K,JSON.stringify(stat))}catch(e){}}
let stat=load();
const all=[];D.forEach((b,i)=>b.qs.forEach((q,j)=>all.push({...q,id:i+'-'+j,b:i})));
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function home(){
 const wrong=all.filter(q=>stat[q.id]===0).length,done=all.filter(q=>stat[q.id]!==undefined).length;
 app.innerHTML=`<h1>🦴 Osteologiya testlari</h1><div class="mu">1-kurs, to‘liq oraliq · ${all.length} ta savol · ${D.length} blok</div>
 <div class="g"><div><div class="card"><div class="row"><b>Bloklarni tanlang</b><span><button class="b g" id="sa">Hammasi</button> <button class="b g" id="sn">Hech biri</button></span></div>
 ${D.map((b,i)=>`<div class="blk"><label><input type="checkbox" class="cb" value="${i}" checked> <span>${i+1}. ${b.t}</span></label><span class="tag">${b.qs.length} ta</span></div>`).join('')}</div></div><div>
 <div class="card"><div class="row"><label>Savollar soni (0 = hammasi) <input type="number" id="n" min="0" value="20"></label>
 <label><input type="checkbox" id="rnd" checked> Aralashtirish</label></div>
 <label class="mu"><input type="checkbox" id="onlyw"> Faqat xato qilganlarim (${wrong})</label>
 <div style="margin-top:12px" class="row"><button class="b" id="go">Boshlash</button><span class="tag">Yechilgan: ${done}/${all.length}</span></div></div>
 <div class="card"><b>Qidiruv</b> <input type="search" id="s" placeholder="Masalan: foramen ovale"><div id="sr"></div></div>
 <div class="row"><button class="b g" id="th">🌓 Mavzu</button><button class="b g" id="rs">Natijalarni tozalash</button></div></div></div>`;
 $('#sa').onclick=()=>document.querySelectorAll('.cb').forEach(c=>c.checked=1);
 $('#sn').onclick=()=>document.querySelectorAll('.cb').forEach(c=>c.checked=0);
 $('#go').onclick=()=>{const bs=[...document.querySelectorAll('.cb:checked')].map(c=>+c.value);
  let p=all.filter(q=>bs.includes(q.b));if($('#onlyw').checked)p=p.filter(q=>stat[q.id]===0);
  if($('#rnd').checked)p=sh(p);const n=+$('#n').value;if(n>0)p=p.slice(0,n);
  if(!p.length){alert('Savol topilmadi');return}run(p)};
 $('#th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme;r.dataset.theme=d==='dark'?'light':'dark'};
 $('#rs').onclick=()=>{if(confirm('Barcha natijalar o‘chirilsinmi?')){stat={};save();home()}};
 $('#s').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(v.length<3){$('#sr').innerHTML='';return}
  const r=all.filter(q=>(q.q+' '+q.o.join(' ')).toLowerCase().includes(v)).slice(0,15);
  $('#sr').innerHTML=r.map(q=>`<div class="blk" style="display:block"><div>${esc(q.q)}</div><div class="tag" style="color:var(--ok)">✔ ${esc(q.o[q.a])}</div></div>`).join('')||'<div class="mu">Topilmadi</div>'};
}
function run(qs){let i=0,sc=0,miss=[];
 function show(){const q=qs[i];const ord=sh(q.o.map((t,k)=>k));
  app.innerHTML=`<div class="qz"><div class="row"><button class="b g" id="x">← Chiqish</button><span class="mu">${i+1} / ${qs.length} · ✔ ${sc}</span></div>
  <div class="pb"><i style="width:${i/qs.length*100}%"></i></div><div class="card"><div class="tag">${D[q.b].t}</div><div class="q">${esc(q.q)}</div><div id="os"></div><div id="nx"></div></div></div>`;
  $('#x').onclick=home;
  ord.forEach((k,pos)=>{const b=document.createElement('button');b.className='o';b.textContent=String.fromCharCode(65+pos)+') '+q.o[k];
   b.onclick=()=>{const ok=k===q.a;stat[q.id]=ok?1:0;save();if(ok)sc++;else miss.push(q);
    [...$('#os').children].forEach((x,p)=>{x.disabled=true;if(ord[p]===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
    $('#nx').innerHTML=`<button class="b" id="n">${i+1<qs.length?'Keyingisi →':'Natija'}</button>`;$('#n').onclick=()=>{i++;i<qs.length?show():end()}};
   $('#os').appendChild(b)})}
 function end(){const p=Math.round(sc/qs.length*100);
  app.innerHTML=`<div class="qz"><div class="card" style="text-align:center"><div class="big">${p}%</div><div>${sc} / ${qs.length} to‘g‘ri</div>
  <div style="margin-top:12px"><button class="b" id="h">Bosh sahifa</button> ${miss.length?'<button class="b g" id="rm">Xatolarni qayta yechish</button>':''}</div></div>
  ${miss.map(q=>`<div class="card"><div>${esc(q.q)}</div><div class="tag" style="color:var(--ok)">✔ ${esc(q.o[q.a])}</div></div>`).join('')}</div>`;
  $('#h').onclick=home;if(miss.length)$('#rm').onclick=()=>run(sh(miss))}
 show()}
home();
</script></body></html>
